<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIAGNOSTIC</title>
  <style>
    body { background:#000; color:#0f0; font-family:monospace; padding:16px; font-size:14px; }
    .box { border:1px solid #0f0; padding:12px; margin-bottom:12px; }
    .err { color:#f44; }
    .ok { color:#4f4; }
    .label { color:#ff0; font-weight:bold; }
    pre { white-space:pre-wrap; word-break:break-all; }
  </style>
</head>
<body>

<div class="box">
  <div class="label">1. HTML LOADED</div>
  <div id="s1" class="ok">✅ The HTML file loaded</div>
</div>

<div class="box">
  <div class="label">2. SCRIPT STARTED</div>
  <div id="s2" class="err">❌ Script has NOT run yet</div>
</div>

<div class="box">
  <div class="label">3. FETCHING /api/config</div>
  <div id="s3">Waiting...</div>
</div>

<div class="box">
  <div class="label">4. RESULT</div>
  <pre id="s4">Waiting...</pre>
</div>

<div class="box">
  <div class="label">5. BROWSER INFO</div>
  <pre id="s5"></pre>
</div>

<script>
  // Step 2 — prove the script runs
  document.getElementById('s2').textContent = '✅ Script started at ' + new Date().toISOString();
  document.getElementById('s2').className = 'ok';

  // Step 5 — browser info
  document.getElementById('s5').textContent =
    'URL: ' + window.location.href + '\n' +
    'User agent: ' + navigator.userAgent;

  // Step 3 — fetch
  document.getElementById('s3').textContent = 'Fetching /api/config...';

  fetch('/api/config')
    .then(function (response) {
      document.getElementById('s3').textContent =
        'HTTP Status: ' + response.status + ' ' + response.statusText;
      return response.text();
    })
    .then(function (text) {
      document.getElementById('s4').textContent = 'RAW RESPONSE:\n' + text;

      // Try to parse as JSON
      try {
        var data = JSON.parse(text);
        document.getElementById('s4').textContent +=
          '\n\nPARSED OK:\n' + JSON.stringify(data, null, 2);
        document.getElementById('s4').className = 'ok';
      } catch (e) {
        document.getElementById('s4').textContent +=
          '\n\nJSON PARSE FAILED: ' + e.message;
        document.getElementById('s4').className = 'err';
      }
    })
    .catch(function (error) {
      document.getElementById('s4').textContent =
        'FETCH FAILED: ' + error.message;
      document.getElementById('s4').className = 'err';
    });
</script>

</body>
</html>
